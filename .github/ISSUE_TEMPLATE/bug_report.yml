name: Bug report
description: Create a bug report to help us improve
labels:
  - 'type: bug'
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: >
        A clear description of the bug. If possible, explicitly indicate the
        expected behavior vs. the observed behavior.
      placeholder: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        If available, please include detailed reproduction steps.

        If the bug requires software that is not publicly available, see if it
        can be reproduced with software that is publicly available.
      placeholder: How can others reproduce the issue?
  - type: markdown
    attributes:
      value: |
        # Environment

        Please include the following details of your environment.
  - type: textarea
    id: ttcVersion
    attributes:
        label: "TTC version"
        placeholder: "`ttc --version` and `ttcd --version`"
        render: shell
  - type: input
    id: uname
    attributes:
        label: "uname"
        placeholder: "`uname -a`"
  - type: input
    id: gitDescribe
    attributes:
        label: "repo state (if built from source)"
        placeholder: "`git describe`"
  - type: textarea
    id: ttcLogs
    attributes:
        label: "TTC logs and diagnostics"
        description: >
          Include `ttc daemon status`, the relevant `ttc logs` output, and the
          daemon startup log path when available. Remove secrets first.
        render: shell
