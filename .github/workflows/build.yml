name: TTC build

"on":
  push:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: bazel
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo -E apt update && sudo -E apt install -y make

    - name: Checkout
      uses: actions/checkout@v5

    - name: Build static TTC binaries
      run: |
        mkdir -p bin
        make copy TARGETS="runsc/ttc runsc/ttcd" DESTINATION="$PWD/bin"
        file bin/ttc bin/ttcd
        file bin/ttc | grep -q "statically linked"
        file bin/ttcd | grep -q "statically linked"

    - name: Upload TTC binaries
      uses: actions/upload-artifact@v4
      with:
        name: ttc-linux-amd64
        path: |
          bin/ttc
          bin/ttcd
