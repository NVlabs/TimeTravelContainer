[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttcx"
version = "0.1.0"
description = "Python SDK for TimeTravelContainer"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "TimeTravelContainer contributors"}]
keywords = ["container", "gvisor", "sandbox", "fork"]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/gzz2000/TimeTravelOS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ttcx = ["py.typed"]
